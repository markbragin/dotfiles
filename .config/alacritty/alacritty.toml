[general]
import = [
    "~/.config/alacritty/theme.toml",
]

[font]
size = 12

[font.bold]
family = "JetBrainsMonoNerdFont"
style = "Bold"

[font.italic]
family = "JetBrainsMonoNerdFont"
style = "Italic"

[font.normal]
family = "JetBrainsMonoNLNerdFont"
style = "Medium"

[scrolling]
history = 10000
multiplier = 3

[terminal.shell]
program = "/bin/bash"

[window.dimensions]
columns = 80
lines = 24

[env]
TERM = "xterm-256color"

[terminal]
